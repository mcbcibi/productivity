<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FFD43B'><rect width='24' height='24' rx='6' fill='%23FFD43B'/><path d='M9 12l2 2 4-4' stroke='%23000' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productivity - Tasks, Lists & Notes</title>
    <meta name="description" content="Clean, minimal productivity to-do list web app with smart views, subtasks, sticky wall, and calendar." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-sage-100 dark:bg-stone-950 text-stone-800 dark:text-stone-100 antialiased selection:bg-brand-yellow selection:text-stone-900">
    <div id="root">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #E8EFEA; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; text-align: center; color: #1c1917;">
        <div style="background: white; border-radius: 24px; padding: 36px; max-width: 500px; box-shadow: 0 20px 40px -15px rgba(0,0,0,0.08); border: 1px solid rgba(0,0,0,0.08);">
          <div style="width: 52px; height: 52px; background: #FFD43B; border-radius: 16px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 26px;">📋</div>
          <h2 style="font-size: 22px; font-weight: 700; margin: 0 0 10px; color: #1c1917;">Productivity App</h2>
          <p style="font-size: 14px; color: #78716c; line-height: 1.6; margin: 0 0 20px;">
            This is a React + Vite application. To view it live, open:
          </p>
          <a href="http://localhost:5173" style="display: inline-block; background: #FFD43B; color: #1c1917; font-weight: 700; font-size: 14px; padding: 10px 24px; border-radius: 12px; text-decoration: none; margin-bottom: 16px; box-shadow: 0 4px 12px rgba(255,212,59,0.4);">
            Open http://localhost:5173
          </a>
          <p style="font-size: 12px; color: #a8a29e; margin: 0;">
            Make sure the dev server is active by running <code style="background: #f5f5f4; padding: 2px 6px; border-radius: 4px;">npm run dev</code>.
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
